{% if user %}
<div class="d-flex align-items-center gap-2">
  <span class="user-pill">👤 {{ user.name }}</span>
  <a href="{{ url_for('logout') }}" class="btn-logout">Вийти</a>
</div>
{% else %}
<div class="d-flex gap-2">
  <a href="{{ url_for('login') }}" class="btn-login">Увійти</a>
  <a href="{{ url_for('register') }}" class="btn-register">Реєстрація</a>
</div>
{% endif %}
