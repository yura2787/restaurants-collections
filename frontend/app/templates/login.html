{% extends "components/base.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h3>Вхід в акаунт</h3>
    {% if errors %}
    <div class="alert alert-danger" role="alert">
        {{ errors[0] }}
    </div>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email</label>
        <input type="email" name="user_email" class="form-control" id="exampleInputEmail1" placeholder="name@example.com">
      </div>
      <div class="mb-4">
        <label for="exampleInputPassword1" class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" id="exampleInputPassword1" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Увійти</button>
    </form>
    <p class="text-center mt-3 mb-0" style="font-size:0.9rem; color:#6b6f80;">
      Немає акаунту? <a href="{{ url_for('register') }}" style="color:#e94560; text-decoration:none; font-weight:600;">Зареєструватися</a>
    </p>
  </div>
</div>
{% endblock %}
