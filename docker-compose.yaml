

services:
  database:
    image: postgres:16-alpine
    container_name: database
    hostname: local_database
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_datastorage:/var/lib/postgresql/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_api:
    build:
      dockerfile: Dockerfile
      context: backend_api
    container_name: Backend_api
    hostname: backend_api
    restart: always
    depends_on:
      database:
        condition: service_healthy
      notification:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./backend_api/app:/app
    command: |
      sh -c "
      uvicorn main:app --port=9999 --host=0.0.0.0 --reload
      "
    networks:
      - main_network

  frontend:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    container_name: frontend
    hostname: frontend
    restart: always
    env_file:
      - .env
    volumes:
      - ./frontend/app:/app
    command: |
      sh -c "
      uvicorn main:app --port=12345 --host=0.0.0.0 --reload
      "
    networks:
      - main_network

  notification:
    build:
      dockerfile: Dockerfile
      context: ./notification_service
    container_name: notification
    hostname: notification
    restart: always
    env_file:
      - .env
    volumes:
      - ./notification_service/app:/app
    command: |
      sh -c "
      python /app/main.py
      "
    networks:
      - main_network

  nginx_project:
    image: nginx:alpine
    container_name: nginx_project
    restart: always
    ports:
      - "80:80"
    networks:
      - main_network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

networks:
  main_network:
    driver: bridge

volumes:
  postgres_datastorage:
    external: false


